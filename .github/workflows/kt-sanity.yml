name: kt-sanity
on:
  pull_request:
  push:

jobs:
  sanity:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: \"1\"
      PYTHONPYCACHEPREFIX: /tmp/kt-pycache
    steps:
      - uses: actions/checkout@v4
      - name: kernel-tooling version
        run: tools/cli/kt version
      - name: validate kernel-tooling config
        run: tools/cli/kt config validate
      - name: doctor
        run: tools/cli/kt doctor
